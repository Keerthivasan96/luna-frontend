<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#667eea" />
  <meta name="description" content="Luna - Your AI Companion" />
  
  <title>Luna ✨</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  
  <div class="immersive-container">
    <!-- Tagline (top-left) -->
    <div class="tagline">
      <div class="tagline-main">The AI companion who cares</div>
      <div class="tagline-sub">Always here to listen and talk.<br>Always on your side.</div>
    </div>
    
    <!-- 3D Avatar Container -->
    <div id="canvas-container" aria-label="Your AI Companion">
      <div id="avatar-scroll-safe"></div>
      
      <!-- Loading Indicator -->
      <div id="loading-indicator" class="loading-indicator">
        <div class="loading-spinner"></div>
        <span>Loading...</span>
      </div>
    </div>

    <!-- Status Message (top center) -->
    <div id="status" class="status-message" aria-live="polite">
      Ready to chat! 💭
    </div>

    <!-- Menu Toggle Button (top right) -->
    <button id="menuToggle" class="menu-toggle" title="Settings" aria-label="Open settings menu">
      ⋮
    </button>
    
    <!-- Text Input Bar (bottom - Replika style) -->
    <div id="chatInputBar" class="chat-input-bar">
      <button id="enterRoomBtn" class="enter-room-btn" title="Enter room view" aria-label="Enter immersive room view">
        🏠
      </button>
      
      <div class="input-wrapper">
        <input 
          type="text" 
          id="chatInput" 
          class="chat-input" 
          placeholder="Type a message..." 
          aria-label="Chat input"
        />
        <button id="sendBtn" class="send-btn" title="Send message" aria-label="Send message">
          ✈️
        </button>
        <button id="micToggleBtn" class="mic-toggle-btn active" title="Voice input" aria-label="Toggle voice input">
          🎤
        </button>
      </div>
    </div>

    <!-- AI Reply Caption (above input) -->
    <div id="chatCaption" class="chat-caption" role="status" aria-live="polite">
      Ready to chat! 💭
    </div>
    
    <!-- Room View Controls (hidden by default) -->
    <div id="roomControls" class="room-controls" style="display: none;">
      <button id="exitRoomBtn" class="exit-room-btn" title="Exit room view" aria-label="Back to chat view">
        ← Back to Chat
      </button>
      <button id="exploreBtn" class="explore-btn" title="Zoom out to explore" aria-label="Explore room">
        🔍 Explore
      </button>
    </div>
    
    <!-- Settings Menu Panel -->
    <div id="menuPanel" class="menu-panel" role="dialog" aria-label="Settings">
      <div class="menu-header">
        <h3>Settings</h3>
        <button id="menuClose" class="menu-close" aria-label="Close settings">×</button>
      </div>
      
      <div class="menu-content">
        
        <!-- Reply Preference -->
        <div class="menu-item">
          <label>Reply Preference</label>
          <div class="reply-preference-grid">
            <button class="reply-pref-btn" data-pref="text" title="Text replies only">
              💬 Text
            </button>
            <button class="reply-pref-btn active" data-pref="voice" title="Voice replies only">
              🎤 Voice
            </button>
            <button class="reply-pref-btn" data-pref="both" title="Both text and voice">
              ✨ Both
            </button>
          </div>
        </div>

        <!-- Divider -->
        <div class="menu-divider"></div>
        
        <!-- Avatar Selection -->
        <div class="menu-item">
          <label>Choose Avatar</label>
          <div class="avatar-grid">
            <button class="avatar-option active" data-avatar="/assets/vrmavatar1.vrm" title="Avatar 1" aria-label="Select Avatar 1">
              <span class="avatar-emoji">👧</span>
            </button>
            <button class="avatar-option" data-avatar="/assets/vrmavatar2.vrm" title="Avatar 2" aria-label="Select Avatar 2">
              <span class="avatar-emoji">👩</span>
            </button>
            <button class="avatar-option" data-avatar="/assets/vrmavatar3.vrm" title="Avatar 3" aria-label="Select Avatar 3">
              <span class="avatar-emoji">👱‍♀️</span>
            </button>
            <button class="avatar-option" data-avatar="/assets/vrmavatar4.vrm" title="Avatar 4" aria-label="Select Avatar 4">
              <span class="avatar-emoji">🧑</span>
            </button>
          </div>
        </div>

        <!-- Divider -->
        <div class="menu-divider"></div>

        <!-- Background Music -->
        <div class="menu-item">
          <label>Background Music</label>
          <button id="musicToggle" class="mode-toggle-btn" aria-label="Toggle background music">
            <span class="mode-label">Music Off</span>
            <div class="toggle-switch"></div>
          </button>
          <div class="volume-control">
            <span class="volume-icon">🔊</span>
            <input 
              type="range" 
              id="musicVolume" 
              min="0" 
              max="100" 
              value="30" 
              class="volume-slider"
              aria-label="Music volume"
            >
          </div>
        </div>

        <!-- Divider -->
        <div class="menu-divider"></div>

        <!-- Conversation Mode Toggle -->
        <div class="menu-item">
          <label>Conversation Mode</label>
          <button id="modeToggle" class="mode-toggle-btn" aria-label="Toggle conversation mode">
            <span class="mode-label">Casual Chat</span>
            <div class="toggle-switch"></div>
          </button>
          <p class="menu-hint">Casual = friendly chat • Practice = grammar help</p>
        </div>

        <!-- Practice Mode Corrections Display -->
        <div id="correctionDisplay" class="menu-item" style="display: none;">
          <label>Latest Correction</label>
          <div id="correctionContent" class="correction-display"></div>
        </div>

        <!-- Divider -->
        <div class="menu-divider"></div>

        <!-- Action Buttons -->
        <div class="menu-item">
          <button id="clearBtn" class="menu-action-btn" aria-label="Start fresh conversation">
            🔄 Start Fresh Conversation
          </button>
        </div>

        <div class="menu-item">
          <button id="demoLessonBtn" class="menu-action-btn" aria-label="Get daily challenge">
            ✨ Daily Challenge
          </button>
        </div>

        <!-- Debug Log (collapsed by default) -->
        <details class="menu-item">
          <summary>Debug Log</summary>
          <div id="log" class="debug-log"></div>
        </details>
      </div>
    </div>

    <!-- Menu Overlay (for closing menu when clicking outside) -->
    <div id="menuOverlay" class="menu-overlay"></div>

  </div>

  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  
  <!-- Main Application -->
  <script type="module" src="/src/app.js"></script>
</body>
</html>
