<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#9B8AC4" />
  <meta name="description" content="Luna - Your AI Companion" />
  
  <title>Luna ✨</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  
  <div class="immersive-container">
    
    <!-- 3D Avatar Container (Always Visible) -->
    <div id="canvas-container" aria-label="Luna's Room">
      <div id="avatar-scroll-safe"></div>
      
      <!-- Loading Indicator -->
      <div id="loading-indicator" class="loading-indicator">
        <div class="loading-spinner"></div>
        <span>Loading...</span>
      </div>
    </div>

    <!-- ============================================
         PREVIEW INTERFACE (Default on load)
         ============================================ -->
    <div id="previewInterface" class="preview-interface">
      
      <!-- Small greeting bubble near avatar -->
      <div class="greeting-bubble">
        <p>Hey. 👋</p>
      </div>
      
      <!-- Primary CTA Button -->
      <button id="startConversationBtn" class="start-conversation-btn">
        <span class="btn-icon">💭</span>
        <span class="btn-text">Start conversation</span>
      </button>
      
      <!-- Small explore button -->
      <button id="exploreBtn" class="explore-icon-btn" title="Explore room">
        🔍
      </button>
      
    </div>

    <!-- ============================================
         CONVERSATION INTERFACE (Hidden by default)
         ============================================ -->
    <div id="conversationInterface" class="conversation-interface" style="display: none;">
      
      <!-- Floating Glass Chat Panel -->
      <div class="chat-panel">
        
        <!-- Messages Area -->
        <div class="messages-container" id="messagesContainer">
          <!-- Messages will appear here -->
        </div>
        
        <!-- Input Bar -->
        <div class="input-bar">
          <button id="micBtn" class="input-icon-btn" title="Voice input" aria-label="Voice input">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="23"></line>
              <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
          </button>
          
          <input 
            type="text" 
            id="chatInput" 
            class="chat-input" 
            placeholder="Type a message..." 
            aria-label="Message input"
          />
          
          <button id="sendBtn" class="input-icon-btn" title="Send" aria-label="Send message">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
        
      </div>
      
      <!-- Exit conversation button (top of panel) -->
      <button id="exitConversationBtn" class="exit-conversation-btn" title="Back to preview">
        ← Back
      </button>
      
    </div>

    <!-- Settings Toggle Button (top right - always visible) -->
    <button id="menuToggle" class="menu-toggle" title="Settings" aria-label="Open settings">
      ⋮
    </button>
    
    <!-- Settings Menu Panel -->
    <div id="menuPanel" class="menu-panel" role="dialog" aria-label="Settings">
      <div class="menu-header">
        <h3>Settings</h3>
        <button id="menuClose" class="menu-close" aria-label="Close settings">×</button>
      </div>
      
      <div class="menu-content">
        
        <!-- Reply Preference -->
        <div class="menu-item">
          <label>Reply Preference</label>
          <div class="reply-preference-grid">
            <button class="reply-pref-btn" data-pref="text" title="Text replies only">
              💬 Text
            </button>
            <button class="reply-pref-btn active" data-pref="voice" title="Voice replies only">
              🎤 Voice
            </button>
            <button class="reply-pref-btn" data-pref="both" title="Both text and voice">
              ✨ Both
            </button>
          </div>
        </div>

        <!-- Divider -->
        <div class="menu-divider"></div>
        
        <!-- Avatar Selection -->
        <div class="menu-item">
          <label>Choose Avatar</label>
          <div class="avatar-grid">
            <button class="avatar-option active" data-avatar="/assets/vrmavatar1.vrm" title="Avatar 1" aria-label="Select Avatar 1">
              <span class="avatar-emoji">👧</span>
            </button>
            <button class="avatar-option" data-avatar="/assets/vrmavatar2.vrm" title="Avatar 2" aria-label="Select Avatar 2">
              <span class="avatar-emoji">👩</span>
            </button>
            <button class="avatar-option" data-avatar="/assets/vrmavatar3.vrm" title="Avatar 3" aria-label="Select Avatar 3">
              <span class="avatar-emoji">👱‍♀️</span>
            </button>
            <button class="avatar-option" data-avatar="/assets/vrmavatar4.vrm" title="Avatar 4" aria-label="Select Avatar 4">
              <span class="avatar-emoji">🧑</span>
            </button>
          </div>
        </div>

        <!-- Divider -->
        <div class="menu-divider"></div>

        <!-- Background Music -->
        <div class="menu-item">
          <label>Background Music</label>
          <button id="musicToggle" class="mode-toggle-btn" aria-label="Toggle background music">
            <span class="mode-label">Music Off</span>
            <div class="toggle-switch"></div>
          </button>
          <div class="volume-control">
            <span class="volume-icon">🔊</span>
            <input 
              type="range" 
              id="musicVolume" 
              min="0" 
              max="100" 
              value="30" 
              class="volume-slider"
              aria-label="Music volume"
            >
          </div>
        </div>

        <!-- Divider -->
        <div class="menu-divider"></div>

        <!-- Conversation Mode Toggle -->
        <div class="menu-item">
          <label>Conversation Mode</label>
          <button id="modeToggle" class="mode-toggle-btn" aria-label="Toggle conversation mode">
            <span class="mode-label">Casual Chat</span>
            <div class="toggle-switch"></div>
          </button>
          <p class="menu-hint">Casual = friendly chat • Practice = grammar help</p>
        </div>

        <!-- Practice Mode Corrections Display -->
        <div id="correctionDisplay" class="menu-item" style="display: none;">
          <label>Latest Correction</label>
          <div id="correctionContent" class="correction-display"></div>
        </div>

        <!-- Divider -->
        <div class="menu-divider"></div>

        <!-- Action Buttons -->
        <div class="menu-item">
          <button id="clearBtn" class="menu-action-btn" aria-label="Start fresh conversation">
            🔄 Start Fresh Conversation
          </button>
        </div>

        <div class="menu-item">
          <button id="demoLessonBtn" class="menu-action-btn" aria-label="Get daily challenge">
            ✨ Daily Challenge
          </button>
        </div>

        <!-- Debug Log (collapsed by default) -->
        <details class="menu-item">
          <summary>Debug Log</summary>
          <div id="log" class="debug-log"></div>
        </details>
      </div>
    </div>

    <!-- Menu Overlay -->
    <div id="menuOverlay" class="menu-overlay"></div>

  </div>

  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  
  <!-- Main Application -->
  <script type="module" src="/src/app.js"></script>
</body>
</html>
